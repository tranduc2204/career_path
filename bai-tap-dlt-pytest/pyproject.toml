[project]
name = "bai-tap-dlt-pytest"
version = "0.1.0"
description = "Lab GĐ3 tuần 11: viết pytest cho pipeline dlt (API giả lập → DuckDB), chấm bằng mutation testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb]>=1.10,<2",
    "duckdb>=1.4,<2",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

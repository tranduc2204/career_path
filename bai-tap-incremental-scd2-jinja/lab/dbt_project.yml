name: lab
version: "1.0.0"
config-version: 2 
profile: lab

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Số ngày lùi lại khi lọc incremental (bài I6, J7)
  lookback_days: 3
  # Danh sách trạng thái đơn hàng (bài J3)
  order_statuses: ["placed", "shipped", "delivered", "cancelled","returned"]
  
  # quy tắc doanh thu
  non_revenue_statuses: ["cancelled","returned"]
models:
  lab:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +schema: marts

# dbt_utils tìm macro trong project `lab` trước (để dùng bản vá duckdb__ ở macros/,
# vì dbt_utils không có bản cài đặt riêng cho DuckDB của get_tables_by_pattern_sql)
dispatch:
  - macro_namespace: dbt_utils
    search_order: ["lab", "dbt_utils"]

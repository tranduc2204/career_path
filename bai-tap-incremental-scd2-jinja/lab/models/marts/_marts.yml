models:
  - name: fct_order_lines
    description: "check"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, line_no]
    columns:
      - name: order_date
        data_tests: [not_null]
      - name: line_amount
        data_tests:
          - is_positive:
              arguments:
                allow_zero: true
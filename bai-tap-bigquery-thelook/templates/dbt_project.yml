name: thelook
version: "1.0.0"
config-version: 2
profile: thelook

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

# Gắn label cho từng JOB BigQuery (xem macros/query_comment.sql, lý thuyết 7.5)
query-comment:
  comment: "{{ query_comment(node) }}"
  job-label: true

models:
  thelook:
    +labels:
      team: analytics
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      +persist_docs:
        relation: true
        columns: true

[project]
name = "bai-tap-kimball-data-vault"
version = "0.1.0"
description = "Lab GĐ2: Kimball nâng cao + Data Vault 2.0 (automate_dv) trên DuckDB, giả lập nguồn theo ngày, tự chấm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Giữ dbt Core v1 (khớp lab GĐ1 và tài liệu lý thuyết)
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    # DuckDB 2.0 ra 21/10/2026, dbt-duckdb 1.11 chưa kiểm thử với bản này. Lab đã kiểm chứng trên 1.5.x
    "duckdb>=1.4,<2",
]

[tool.uv]
package = false

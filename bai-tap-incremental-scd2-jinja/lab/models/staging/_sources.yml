version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: customer_changelog
        description: "Customer changelog table"
        columns:
          - name: customer_id
            data_type: integer
          - name: op
            data_type: varchar
          - name: full_name
            data_type: varchar
          - name: email
            data_type: varchar
          - name: city
            data_type: varchar
          - name: tier
            data_type: varchar
          - name: changed_at
            data_type: timestamp
          - name: _loaded_at
            data_type: timestamp

      - name: customers
        description: "Customer table"
        columns:
          - name: customer_id
            data_type: integer
          - name: full_name
            data_type: varchar
          - name: email
            data_type: varchar
          - name: city
            data_type: varchar
          - name: tier
            data_type: varchar
          - name: updated_at
            data_type: timestamp
          - name: _loaded_at
            data_type: timestamp

      - name: events
        description: "Events table"
        columns:
          - name: event_id
            data_type: varchar
          - name: user_id
            data_type: integer
          - name: event_type
            data_type: varchar
          - name: event_ts
            data_type: timestamp
          - name: _loaded_at
            data_type: timestamp

      - name: order_items
        description: "Order items table"
        columns:
          - name: order_id
            data_type: integer
          - name: line_no
            data_type: integer
          - name: product_id
            data_type: integer
          - name: quantity
            data_type: integer
          - name: unit_price_cents
            data_type: integer
          - name: _loaded_at
            data_type: timestamp

      - name: orders
        description: "Orders table"
        columns:
          - name: order_id
            data_type: integer
          - name: customer_id
            data_type: integer
          - name: order_date
            data_type: date
          - name: status
            data_type: varchar
          - name: amount_cents
            data_type: integer
          - name: updated_at
            data_type: timestamp
          - name: _loaded_at
            data_type: timestamp

      - name: products
        description: "Products table"
        columns:
          - name: product_id
            data_type: integer
          - name: product_name
            data_type: varchar
          - name: category
            data_type: varchar
          - name: list_price_cents
            data_type: integer
          - name: _loaded_at
            data_type: timestamp


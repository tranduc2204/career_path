# PR đóng (merge hoặc không) → xoá mọi dataset ci_pr_<số PR>_* mà CI đã tạo.
name: Cleanup CI datasets

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GCP_PROJECT_NONPROD: ${{ vars.GCP_PROJECT_NONPROD }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Xác thực Google Cloud (service account CI)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_CI }}

      - name: Cài gcloud (kèm bq)
        uses: google-github-actions/setup-gcloud@v3

      - name: Xoá dataset của PR
        run: |
          datasets=$(bq ls --project_id="${GCP_PROJECT_NONPROD}" --max_results=10000 --format=json \
            | jq -r '.[]?.datasetReference.datasetId' \
            | grep -E "^ci_pr_${PR_NUMBER}(_|$)" || true)
          if [ -z "${datasets}" ]; then
            echo "Không có dataset nào của PR ${PR_NUMBER}"
            exit 0
          fi
          for ds in ${datasets}; do
            echo "Xoá ${GCP_PROJECT_NONPROD}:${ds}"
            bq rm -r -f -d "${GCP_PROJECT_NONPROD}:${ds}"
          done

name: lab
version: "1.0.0"
config-version: 2
profile: lab

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  require_yaml_configuration_for_mf_time_spines: true

vars:
  # ĐỒNG HỒ CỦA LAB — simulate.py tự cập nhật 2 dòng này mỗi lần reset/next/goto. Đừng sửa tay.
  lab_now: "2026-12-01 06:30:00"                 # LAB_CLOCK  (macros/lab_clock.sql → current_timestamp())
  custom_run_started_at: "2026-12-01T06:30:00"   # LAB_CLOCK  (Elementary dùng làm "bây giờ")
  # G5: chỉ target có quyền (prod_pii) mới thấy PII thật
  pii_access: "{{ target.name == 'prod_pii' }}"

models:
  lab:
    staging:
      +materialized: view
      +schema: staging
      +access: private               # G2: chỉ model cùng nhóm được ref
      shop:
        +group: commerce
      erp:
        +group: commerce
      crm:
        +group: customer
      web:
        +group: growth
      mkt:
        +group: growth
    marts:
      +materialized: table
      +schema: marts
      +access: public                # G2: giao diện cho các nhóm khác
      +contract:
        enforced: true               # G3
      commerce:
        +group: commerce
      customer:
        +group: customer
      growth:
        +group: growth
    growth:
      +materialized: view
      +schema: growth
      +group: growth
      +access: protected
    semantic:
      +materialized: table
      +schema: semantic
  elementary:
    +schema: elementary
